[package]
name = "cuda-bindings"
version = "0.4.0"
authors = ["Melih Elibol"]
edition = "2021"
rust-version = "1.89"
description = "NVIDIA CUDA bindings."
readme = "README.md"
# Lets build.rs hand the recorded header cfgs (e.g. cuda_has_multicast) to
# dependents as DEP_CUDA_BINDINGS_<CFG> without them probing a toolkit.
links = "cuda_bindings"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/cuda-rust.git"

[lib]
doctest = false

[dependencies]
libloading = "0.8"

[build-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
missing_safety_doc = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
single_range_in_vec_init = "allow"
